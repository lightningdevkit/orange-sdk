name: orange-sdk-vss

services:
  vss-server:
    build:
      context: https://github.com/lightningdevkit/vss-server.git#v0.1.0-alpha.0
    environment:
      VSS_BIND_ADDRESS: 0.0.0.0:6754
      VSS_LOG_LEVEL: info
      VSS_PSQL_ADDRESS: postgres:5432
    ports:
      - "127.0.0.1:6754:6754"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
