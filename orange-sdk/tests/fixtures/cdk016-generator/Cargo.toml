[package]
name = "orange-cdk016-fixture"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
cdk = { version = "=0.16.0", default-features = false, features = ["wallet"] }
ldk-node = { git = "https://github.com/lightningdevkit/ldk-node", rev = "0cea34122767f0b86ebaf29c03f49eb38a85fc00" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = "1"
