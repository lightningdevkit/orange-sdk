[workspace]
members = [
    "orange-sdk",
    "graduated-rebalancer",
    "examples/cli",
    "bindings/uniffi-bindgen",
]
default-members = ["orange-sdk"]
exclude = ["vendor/bitreq", "vendor/ldk-node"]
resolver = "2"

[profile.release-smaller]
inherits = "release"
opt-level = 'z'     # Optimize for size.
lto = true          # Enable Link Time Optimization
codegen-units = 1   # Reduce number of codegen units to increase optimizations.
panic = 'abort'     # Abort on panic

[workspace.dependencies]
bitcoin-payment-instructions = { git = "https://github.com/tnull/bitcoin-payment-instructions", rev = "ff09ce9401afa448549a8f101172700bcd14d7bb" }
lightning = { git = "https://github.com/lightningdevkit/rust-lightning", rev = "3dfcc4cca1866c5e5d4d4eaf3b82e09584e2ce5c" }
lightning-invoice = { git = "https://github.com/lightningdevkit/rust-lightning", rev = "3dfcc4cca1866c5e5d4d4eaf3b82e09584e2ce5c" }

[profile.release]
panic = "abort"

[profile.dev]
panic = "abort"

[patch.crates-io]
# Keep HTTP/1.1 VSS connections alive when a proxy omits the optional
# `Connection: keep-alive` response header.
bitreq = { path = "vendor/bitreq" }

[patch."https://github.com/lightningdevkit/ldk-node"]
# Reuse the schema-setup HTTP pool for subsequent VSS operations, avoiding a
# second connection and TLS handshake during wallet startup.
ldk-node = { path = "vendor/ldk-node" }
